name: Deploy Lambda Workers

on:
  push:
    branches: [main]
    paths:
      - "lambdas/chunk_worker/**"
      - "lambdas/ci_worker/**"
      - "lambdas/ner/**"
      - "lambdas/normalize/**"
      - "lambdas/embedding/**"
      - "lambdas/ontology/**"
      - "lambdas/index/**"
      - "lambdas/extraction/**"
      - "shared/**"
      - ".github/workflows/deploy-chunk-worker.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Which lambda to deploy"
        required: false
        default: all
        type: choice
        options:
          - all
          - chunk_worker
          - ci_worker

# ── Path-change detection ─────────────────────────────────────────────────────
# The `changes` job decides which workers need rebuilding.
# Both workers share ner/normalize/embedding/ontology/index/shared —
# a change to any of those triggers both deploys simultaneously.
# A change only to lambdas/chunk_worker/** triggers only the chunk deploy.
# A change only to lambdas/ci_worker/**   triggers only the CI deploy.
# workflow_dispatch lets you force-deploy one or both manually.
jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      chunk_worker: ${{ steps.filter.outputs.chunk_worker }}
      ci_worker:    ${{ steps.filter.outputs.ci_worker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            chunk_worker:
              - 'lambdas/chunk_worker/**'
              - 'lambdas/ner/**'
              - 'lambdas/normalize/**'
              - 'lambdas/embedding/**'
              - 'lambdas/ontology/**'
              - 'lambdas/index/**'
              - 'lambdas/extraction/**'
              - 'shared/**'
              - '.github/workflows/deploy-chunk-worker.yml'
            ci_worker:
              - 'lambdas/ci_worker/**'
              - 'lambdas/ner/**'
              - 'lambdas/normalize/**'
              - 'lambdas/embedding/**'
              - 'lambdas/ontology/**'
              - 'lambdas/index/**'
              - 'shared/**'
              - '.github/workflows/deploy-chunk-worker.yml'

  # ── chunk_worker ─────────────────────────────────────────────────────────────
  deploy-chunk-worker:
    name: Deploy chunk_worker (rls-ci-chunk-worker)
    needs: changes
    if: |
      (github.event_name == 'push' && needs.changes.outputs.chunk_worker == 'true') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'chunk_worker'))
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      AWS_REGION:    eu-west-1
      FUNCTION_NAME: rls-ci-chunk-worker
      ECR_REPO:      rls-ci-chunk-worker

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            eu-west-1

      - uses: docker/setup-buildx-action@v3

      - name: Deploy
        env:
          ROLE_ARN:  ${{ secrets.ROLE_ARN }}
          HF_TOKEN:  ${{ secrets.HF_TOKEN }}
        run: |
          chmod +x tools/deploy_chunk_worker.sh
          tools/deploy_chunk_worker.sh

  # ── ci_worker ─────────────────────────────────────────────────────────────────
  deploy-ci-worker:
    name: Deploy ci_worker (rls-ci-worker)
    needs: changes
    if: |
      (github.event_name == 'push' && needs.changes.outputs.ci_worker == 'true') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'ci_worker'))
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      AWS_REGION:    eu-west-1
      FUNCTION_NAME: rls-ci-worker
      ECR_REPO:      rls-ci-worker

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            eu-west-1

      - uses: docker/setup-buildx-action@v3

      - name: Deploy
        env:
          ROLE_ARN:  ${{ secrets.ROLE_ARN }}
          HF_TOKEN:  ${{ secrets.HF_TOKEN }}
        run: |
          chmod +x tools/deploy_ci_worker.sh
          tools/deploy_ci_worker.sh
