name: Deploy Chunk Worker

on:
  push:
    branches: [main]
    paths:
      - "lambdas/chunk_worker/**"
      - "lambdas/ner/**"
      - "lambdas/normalize/**"
      - "lambdas/embedding/**"
      - "lambdas/ontology/**"
      - "lambdas/index/**"
      - "lambdas/extraction/**"
      - "shared/**"
      - ".github/workflows/deploy-chunk-worker.yml"
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  deploy:
    name: Build & Deploy to Lambda
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      AWS_REGION: eu-west-1
      FUNCTION_NAME: rls-ci-chunk-worker
      ECR_REPO: rls-ci-chunk-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Deploy
        env:
          ROLE_ARN: ${{ secrets.ROLE_ARN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          chmod +x tools/deploy_chunk_worker.sh
          tools/deploy_chunk_worker.sh
