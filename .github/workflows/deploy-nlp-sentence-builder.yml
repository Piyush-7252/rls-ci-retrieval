name: Deploy NLP Sentence Builder

on:
  push:
    branches:
      - main
    paths:
      - "ecs/nlp-sentence-builder/**"
      - "shared/**"
      - ".github/workflows/deploy-nlp-sentence-builder.yml"

  workflow_dispatch:
    inputs:
      deployment:
        description: "Deployment environment"
        required: false
        default: dev
        type: choice
        options:
          - dev
          - qa
          - cqa
          - prod

env:
  ECR_REPOSITORY: rls-ci-retrieval-nlp-sentence-builder
  ECS_TASK_DEFINITION: rls-ci-retrieval-nlp-sentence-builder
  ECS_CONTAINER_NAME: rls-ci-retrieval-nlp-sentence-builder

jobs:
  config:
    name: Resolve deployment config (${{ github.event.inputs.deployment || 'dev' }})
    runs-on: ubuntu-latest
    outputs:
      deployment:          ${{ steps.set.outputs.deployment }}
      aws_region:          ${{ steps.set.outputs.aws_region }}
      callback_url:        ${{ steps.set.outputs.callback_url }}
      opensearch_endpoint: ${{ steps.set.outputs.opensearch_endpoint }}
    steps:
      - name: Set config for deployment
        id: set
        run: |
          DEPLOYMENT="${{ github.event.inputs.deployment || 'dev' }}"

          case "$DEPLOYMENT" in
            dev)
              AWS_REGION="eu-west-1"
              CALLBACK_URL="https://api.app-dev.rlsciences.com"
              OPENSEARCH_ENDPOINT="search-rls-dev-rhitzxwnctmuyq2l4kny5kwelu.eu-west-1.es.amazonaws.com"
              ;;
            qa)
              AWS_REGION="us-east-1"
              CALLBACK_URL="https://api.app-qa.rlsciences.com"
              OPENSEARCH_ENDPOINT="search-rls-qa-u7jwn3q2hr3hxp7y2ydab34tfq.us-east-1.es.amazonaws.com"
              ;;
            cqa)
              AWS_REGION="eu-west-1"
              CALLBACK_URL="https://api.app-cqa.rlsciences.com"
              OPENSEARCH_ENDPOINT="search-rls-cqa-7sgyfh75bof4w5raojeqrtpwue.eu-west-1.es.amazonaws.com"
              ;;
            prod)
              AWS_REGION="eu-west-1"
              CALLBACK_URL="https://api.app.rlsciences.com"
              OPENSEARCH_ENDPOINT="search-rls-prod-uswe3hhrfhtfq7feh3wnowy7tq.eu-west-1.es.amazonaws.com"
              ;;
            *)
              echo "Unknown deployment: $DEPLOYMENT" >&2
              exit 1
              ;;
          esac

          {
            echo "deployment=$DEPLOYMENT"
            echo "aws_region=$AWS_REGION"
            echo "callback_url=$CALLBACK_URL"
            echo "opensearch_endpoint=$OPENSEARCH_ENDPOINT"
          } >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build and push NLP Sentence Builder image
    needs: config
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      AWS_REGION:          ${{ needs.config.outputs.aws_region }}
      CALLBACK_URL:        ${{ needs.config.outputs.callback_url }}
      OPENSEARCH_ENDPOINT: ${{ needs.config.outputs.opensearch_endpoint }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Debug AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE_TAG="${GITHUB_SHA}"
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "Building: ${IMAGE_URI}"

          docker build             -f ecs/nlp-sentence-builder/Dockerfile             -t "${IMAGE_URI}"             .

          docker push "${IMAGE_URI}"

          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Register ECS task definition with new image
        env:
          IMAGE_URI: ${{ env.IMAGE_URI }}
        run: |
          aws ecs describe-task-definition             --task-definition "${ECS_TASK_DEFINITION}"             --query 'taskDefinition'             --output json > task-definition.json

          python3 - <<'PY'
          import json
          import os

          path = "task-definition.json"
          image = os.environ["IMAGE_URI"]
          container_name = os.environ["ECS_CONTAINER_NAME"]

          with open(path) as f:
              task = json.load(f)

          found = False

          for container in task["containerDefinitions"]:
              if container["name"] == container_name:
                  container["image"] = image
                  found = True

          if not found:
              raise RuntimeError(
                  f"Container '{container_name}' not found in task definition"
              )

          for key in (
              "taskDefinitionArn",
              "revision",
              "status",
              "requiresAttributes",
              "compatibilities",
              "registeredAt",
              "registeredBy",
          ):
              task.pop(key, None)

          with open(path, "w") as f:
              json.dump(task, f)

          PY

          aws ecs register-task-definition             --cli-input-json file://task-definition.json

          echo "Registered new ${ECS_TASK_DEFINITION} revision."

      - name: Deployment summary
        run: |
          echo "=============================================="
          echo "NLP SENTENCE BUILDER IMAGE DEPLOYED"
          echo "=============================================="
          echo "ECR repository : ${ECR_REPOSITORY}"
          echo "Image tag      : ${GITHUB_SHA}"
          echo "Task definition: ${ECS_TASK_DEFINITION}"
          echo ""
          echo "This workflow does NOT start an ECS task."
          echo "Backend is responsible for calling ECS RunTask."
