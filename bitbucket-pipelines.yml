image: atlassian/default-image:3

options:
  docker: true

definitions:
  services:
    docker:
      memory: 5120

  # ─────────────────────────────────────────────────────────────────────────────
  # STEP 1: Build all Docker images (4 Lambda workers + 1 ECS service)
  # Services: document-chunk-worker, ci-worker, search-worker, search-orchestrator, nlp-sentence-builder
  # ─────────────────────────────────────────────────────────────────────────────
  steps:
    - step: &build-all-images
        name: "Build & Push All Images to All ECRs"
        services: [docker]
        caches: [docker]
        size: 2x
        oidc: true
        script:
          # Install AWS CLI v2
          - apt-get update -qq && apt-get install -y -qq unzip curl jq python3 python3-pip
          - curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          - unzip -q awscliv2.zip && ./aws/install --update
          - aws --version

          # Build all Docker images tagged with commit SHA
          - docker build --platform linux/amd64 -f lambdas/worker/document-chunk-worker/Dockerfile -t rls-ci-retrieval-document-chunk-worker:$BITBUCKET_COMMIT .
          - docker build --platform linux/amd64 -f lambdas/worker/ci-worker/Dockerfile -t rls-ci-retrieval-ci-worker:$BITBUCKET_COMMIT .
          - docker build --platform linux/amd64 -f lambdas/worker/search-worker/Dockerfile -t rls-ci-retrieval-search-worker:$BITBUCKET_COMMIT .
          - docker build --platform linux/amd64 -f lambdas/orchestrator/search-orchestrator/Dockerfile -t rls-ci-retrieval-search-orchestrator:$BITBUCKET_COMMIT .
          - docker build --platform linux/amd64 -f ecs/nlp-sentence-builder/Dockerfile -t rls-ci-retrieval-nlp-sentence-builder:$BITBUCKET_COMMIT .

          # Function to push images to an environment
          - |
            push_to_env() {
              local env_name=$1
              local aws_account_id=$2
              local aws_region=$3
              local aws_role_arn=$4
              
              echo "🔄 Authenticating to $env_name ($aws_region)..."
              export AWS_DEFAULT_REGION=$aws_region
              export AWS_ROLE_ARN=$aws_role_arn
              export AWS_WEB_IDENTITY_TOKEN_FILE=$(pwd)/web-identity-token
              echo $BITBUCKET_STEP_OIDC_TOKEN > $AWS_WEB_IDENTITY_TOKEN_FILE
              
              aws sts get-caller-identity
              aws ecr get-login-password --region $aws_region | docker login --username AWS --password-stdin $aws_account_id.dkr.ecr.$aws_region.amazonaws.com
              
              # Push all images
              for image in rls-ci-retrieval-document-chunk-worker rls-ci-retrieval-ci-worker rls-ci-retrieval-search-worker rls-ci-retrieval-search-orchestrator rls-ci-retrieval-nlp-sentence-builder; do
                docker tag $image:$BITBUCKET_COMMIT $aws_account_id.dkr.ecr.$aws_region.amazonaws.com/$image:$BITBUCKET_COMMIT
                docker push $aws_account_id.dkr.ecr.$aws_region.amazonaws.com/$image:$BITBUCKET_COMMIT
                echo "✅ Pushed $image:$BITBUCKET_COMMIT to $env_name"
              done
            }

          # Push to DEV
          - push_to_env "DEV" "$AWS_DEV_ACCOUNT_ID" "$AWS_DEFAULT_REGION_DEV" "$AWS_ROLE_ARN_DEV"
          # Push to QA
          - push_to_env "QA" "$AWS_QA_ACCOUNT_ID" "$AWS_DEFAULT_REGION_QA" "$AWS_ROLE_ARN_QA"
          # Push to CQA (same account as QA, different region)
          - push_to_env "CQA" "$AWS_QA_ACCOUNT_ID" "$AWS_DEFAULT_REGION_CQA" "$AWS_ROLE_ARN_QA"
          # Push to PROD
          - push_to_env "PROD" "$AWS_PROD_ACCOUNT_ID" "$AWS_DEFAULT_REGION_PROD" "$AWS_ROLE_ARN_PROD"

    # ───────────────────────────────────────────────────────────────────────────
    # STEP 2: Deploy to DEV
    # ───────────────────────────────────────────────────────────────────────────
    - step: &deploy-dev
        name: "Deploy to DEV"
        deployment: dev
        trigger: manual
        size: 2x
        oidc: true
        script:
          - apt-get update -qq && apt-get install -y -qq unzip curl jq python3 python3-pip
          - curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          - unzip -q awscliv2.zip && ./aws/install --update
          - export AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION_DEV
          - export AWS_ROLE_ARN=$AWS_ROLE_ARN_DEV
          - export AWS_WEB_IDENTITY_TOKEN_FILE=$(pwd)/web-identity-token
          - echo $BITBUCKET_STEP_OIDC_TOKEN > $AWS_WEB_IDENTITY_TOKEN_FILE
          - aws sts get-caller-identity
          - bash ./ci/deploy.sh dev $BITBUCKET_COMMIT

    # ───────────────────────────────────────────────────────────────────────────
    # STEP 3: Deploy to QA
    # ───────────────────────────────────────────────────────────────────────────
    - step: &deploy-qa
        name: "Deploy to QA"
        deployment: qa
        trigger: manual
        size: 2x
        oidc: true
        script:
          - apt-get update -qq && apt-get install -y -qq unzip curl jq python3 python3-pip
          - curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          - unzip -q awscliv2.zip && ./aws/install --update
          - export AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION_QA
          - export AWS_ROLE_ARN=$AWS_ROLE_ARN_QA
          - export AWS_WEB_IDENTITY_TOKEN_FILE=$(pwd)/web-identity-token
          - echo $BITBUCKET_STEP_OIDC_TOKEN > $AWS_WEB_IDENTITY_TOKEN_FILE
          - aws sts get-caller-identity
          - bash ./ci/deploy.sh qa $BITBUCKET_COMMIT

    # ───────────────────────────────────────────────────────────────────────────
    # STEP 4: Deploy to CQA
    # ───────────────────────────────────────────────────────────────────────────
    - step: &deploy-cqa
        name: "Deploy to CQA"
        deployment: cqa
        trigger: manual
        size: 2x
        oidc: true
        script:
          - apt-get update -qq && apt-get install -y -qq unzip curl jq python3 python3-pip
          - curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          - unzip -q awscliv2.zip && ./aws/install --update
          - export AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION_CQA
          - export AWS_ROLE_ARN=$AWS_ROLE_ARN_QA
          - export AWS_WEB_IDENTITY_TOKEN_FILE=$(pwd)/web-identity-token
          - echo $BITBUCKET_STEP_OIDC_TOKEN > $AWS_WEB_IDENTITY_TOKEN_FILE
          - aws sts get-caller-identity
          - bash ./ci/deploy.sh cqa $BITBUCKET_COMMIT

    # ───────────────────────────────────────────────────────────────────────────
    # STEP 5: Deploy to PROD
    # ───────────────────────────────────────────────────────────────────────────
    - step: &deploy-prod
        name: "Deploy to PROD"
        deployment: prod
        trigger: manual
        size: 2x
        oidc: true
        script:
          - apt-get update -qq && apt-get install -y -qq unzip curl jq python3 python3-pip
          - curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          - unzip -q awscliv2.zip && ./aws/install --update
          - export AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION_PROD
          - export AWS_ROLE_ARN=$AWS_ROLE_ARN_PROD
          - export AWS_WEB_IDENTITY_TOKEN_FILE=$(pwd)/web-identity-token
          - echo $BITBUCKET_STEP_OIDC_TOKEN > $AWS_WEB_IDENTITY_TOKEN_FILE
          - aws sts get-caller-identity
          - bash ./ci/deploy.sh prod $BITBUCKET_COMMIT

pipelines:
  branches:
    main:
      # Build and push all images to all ECRs
      - step: *build-all-images
      # Manual deployment steps
      - step: *deploy-dev
      - step: *deploy-qa
      - step: *deploy-cqa
      - step: *deploy-prod

  custom:
    # Manual trigger for building and pushing images only
    build-and-push:
      - step: *build-all-images

    # Manual trigger for individual environment deployments
    deploy-dev:
      - step: *deploy-dev

    deploy-qa:
      - step: *deploy-qa

    deploy-cqa:
      - step: *deploy-cqa

    deploy-prod:
      - step: *deploy-prod
